name: Robot diario de fuentes oficiales

on:
  schedule:
    - cron: "17 5 * * *" # todos los días 05:17 UTC (07:17 en Croacia, 02:17 en Argentina)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Leer fuentes y detectar novedades
        id: run
        run: node scripts/monitor.mjs
        continue-on-error: true
      - name: Borradores de fichas con IA (solo sobre lo nuevo)
        # Lee la página oficial de cada novedad y deja un borrador en review/queue/.
        # Los montos y plazos solo quedan si aparecen textuales en la fuente. Nada se publica solo.
        run: node scripts/agents/summarize.mjs
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          RADAR_MAX_DRAFTS: "12"
      - name: Abrir PR de revisión si hay novedades
        uses: peter-evans/create-pull-request@v7
        with:
          branch: radar/novedades
          delete-branch: true
          commit-message: "Robot: novedades de fuentes oficiales"
          title: "🔔 Novedades en fuentes oficiales: revisar antes de publicar"
          body-path: review/last_run.md
          labels: revisión
          add-paths: |
            data/sources/**
            review/queue/**
      - name: Fallar si alguna fuente rompió el contrato
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Alguna fuente falló (sin ítems, HTTP distinto de 200 o estructura cambiada). Ver el resumen."
          exit 1
