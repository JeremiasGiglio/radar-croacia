name: Worker del chat (api.zustrolabs.com)

# En los PR: tests + armado sin publicar. En main: publica el Worker, carga la clave de Claude y prueba que responda.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests del Worker
        run: node --test tests/unit/chat-worker.test.mjs tests/unit/whatsapp.test.mjs
      - name: Instalar wrangler
        working-directory: worker
        run: npm ci
      - name: Armado sin publicar (PR)
        if: github.event_name == 'pull_request'
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Publicar
        if: github.event_name != 'pull_request'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx wrangler deploy
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
      - name: Probar que responda
        if: github.event_name != 'pull_request'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.zustrolabs.com/health || true)
            [ "$code" = "200" ] && break
            echo "esperando el dominio ($code)…"; sleep 15
          done
          [ "$code" = "200" ] || { echo "::error::api.zustrolabs.com/health no responde"; exit 1; }
          curl -s -o /dev/null -w 'CORS desde otro origen: %{http_code}\n' -X POST https://api.zustrolabs.com/chat \
            -H 'Origin: https://otro.example' -H 'content-type: application/json' -d '{"messages":[{"role":"user","content":"hola"}]}'
          # La versión nueva tarda unos segundos en llegar a todos lados: mientras siga la vieja, /whatsapp da 404.
          for i in $(seq 1 12); do
            wa=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.zustrolabs.com/whatsapp -d '{}' || true)
            [ "$wa" != "404" ] && break
            echo "esperando la versión nueva ($wa)…"; sleep 10
          done
          echo "WhatsApp sin firma: $wa"
          [ "$wa" = "401" ] || [ "$wa" = "503" ] || { echo "::error::/whatsapp aceptó un pedido sin firma"; exit 1; }
          resp=$(curl -s -X POST https://api.zustrolabs.com/chat -H 'Origin: https://radar.zustrolabs.com' \
            -H 'content-type: application/json' -d '{"messages":[{"role":"user","content":"¿Hay becas para estudiar croata?"}],"perfil":"ar"}')
          echo "$resp" | head -c 600; echo
          echo "$resp" | grep -q '"respuesta"' || { echo "::error::el chat no devolvió una respuesta"; exit 1; }
